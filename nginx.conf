events {}

http {
  upstream chat_backend {
    least_conn;
    server app1:3001;
    server app2:3002;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://chat_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}